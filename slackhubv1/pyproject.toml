[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-hub"
version = "1.0.0"
description = "Automated Slack triage, TODO management & activity digests"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Carlos"}]

dependencies = [
    "slack-sdk>=3.27.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "anthropic>=0.39.0",
    "openai>=1.12.0",
    "google-generativeai>=0.8.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.110.0",
    "gspread>=6.0.0",
    "gspread-formatting>=1.1.0",
    "jinja2>=3.1.0",
    "rich>=13.7.0",
    "emoji>=2.9.0",
    "python-dateutil>=2.8.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
local = [
    "ollama>=0.3.0",
]

[project.scripts]
slack-hub = "slack_hub.cli:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
slack_hub = ["templates/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
