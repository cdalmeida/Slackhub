# Slack Intelligence Hub Configuration
# Generated by: slack-hub init
# Edit this file or re-run 'slack-hub init' to reconfigure.

user_id: ""                      # Your Slack user ID (e.g., U0XXXXXXX)
user_display_name: ""            # Your display name for LLM prompts

# ── Channel Configuration ────────────────────────────────────────────────────
# Organize channels by priority tier. Each tier has a different polling interval.
# Run 'slack-hub channels setup' to populate this interactively.
channels:
  high_priority:
    # - name: "#gpm-leadership"
    #   id: "C0XXXXX01"
    []
  medium_priority:
    []
  low_priority:
    []

# ── Direct Messages ──────────────────────────────────────────────────────────
# DMs are opt-in only. Allowlist mode lets you pick specific conversations.
direct_messages:
  enabled: false
  mode: "allowlist"              # allowlist | all (allowlist strongly recommended)
  use_llm: true                  # Set false to use local keyword matching instead
  polling_interval_min: 10
  allowlist:
    # - name: "VP Product (Sarah K.)"
    #   id: "D0XXXXX01"
    []

# ── Polling Schedule ─────────────────────────────────────────────────────────
polling:
  tiers:
    high_priority:
      interval_min: 10
    medium_priority:
      interval_min: 30
    low_priority:
      interval_min: 60
  schedule:
    active_hours: "08:00-19:00"
    evening_hours: "19:00-22:00"
    overnight: "22:00-08:00"
    timezone: "America/Los_Angeles"
  slack_api:
    max_requests_per_minute: 40

# ── LLM Providers ───────────────────────────────────────────────────────────
# Each task can use a different provider/model for cost optimization.
# Supported providers: google, openai, anthropic, ollama
# Mix and match — e.g., use Gemini for classification and GPT-4o for summaries.
llm:
  classification:
    provider: "google"             # google | openai | anthropic | ollama
    model: "gemini-2.0-flash"      # google: gemini-2.0-flash | openai: gpt-4o-mini | anthropic: claude-haiku-4-5-20251001
  extraction:
    provider: "openai"
    model: "gpt-4o-mini"
  summarization:
    provider: "openai"
    model: "gpt-4o"
  resolution:
    provider: "google"
    model: "gemini-2.0-flash"
  # API keys (or set via environment variables)
  anthropic_api_key: ""          # or ANTHROPIC_API_KEY env var
  google_api_key: ""             # or GOOGLE_API_KEY env var
  openai_api_key: ""             # or OPENAI_API_KEY env var
  openai_base_url: ""            # or OPENAI_BASE_URL env var (for Azure OpenAI or internal gateway)

# ── TODO Management ──────────────────────────────────────────────────────────
todo:
  auto_complete_after_days: 14
  sheet_id: ""                   # Google Sheets spreadsheet ID
  sheet_name: "Slack Hub TODOs"  # Tab name within the spreadsheet
  google_credentials_path: "~/.slack-hub/google-creds.json"

# ── Email Digests ────────────────────────────────────────────────────────────
email:
  daily_digest:
    enabled: true
    send_time: "07:00"
    days: ["mon", "tue", "wed", "thu", "fri"]
  hourly_pulse:
    enabled: true
    start_hour: 11
    end_hour: 17
    skip_if_empty: true
    min_notable_items: 1
    collapse_quiet_channels: true
    quiet_channel_threshold: 3
    days: ["mon", "tue", "wed", "thu", "fri"]
  method: "gmail_api"            # gmail_api | smtp
  recipient: ""                  # Your work email
  timezone: "America/Los_Angeles"
  smtp:                          # Only if method is smtp
    host: "smtp.example.com"
    port: 587
    use_tls: true

# ── General ──────────────────────────────────────────────────────────────────
lookback_hours: 8
thread_depth: 50
db_path: "~/.slack-hub/slack_hub.db"
log_level: "INFO"
